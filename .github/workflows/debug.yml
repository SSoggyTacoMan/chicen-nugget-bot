name: debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
    steps:
      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H hackclub.app >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: variants
        run: |
          set +e
          probe() {
            local name="$1"; shift
            "$@"
            echo "== $name exit=$?"
          }
          probe shell ssh $SSH_OPTS maaren@hackclub.app 'echo shell=$SHELL argv0=$0; echo bash=$BASH_VERSION zsh=$ZSH_VERSION; type rm; type chmod; type set'
          probe setx_exit ssh $SSH_OPTS maaren@hackclub.app 'set -x; echo hi; exit 0'
          probe rm_exit ssh $SSH_OPTS maaren@hackclub.app 'rm -f /nonexistent; exit 0'
          probe rm_status ssh $SSH_OPTS maaren@hackclub.app 'rm -f /nonexistent; echo rc=$?; exit $rc'
          probe binrm ssh $SSH_OPTS maaren@hackclub.app '/bin/rm -f /nonexistent; echo ok'
          probe chmod_only ssh $SSH_OPTS maaren@hackclub.app 'touch /root/slackbot/.env.test; chmod 600 /root/slackbot/.env.test; echo chmod_ok'
          probe chmod_existing ssh $SSH_OPTS maaren@hackclub.app 'chmod 600 /root/slackbot/.env; echo chmod_env_ok'
          probe write_chmod ssh $SSH_OPTS maaren@hackclub.app 'cat > /root/slackbot/.env.test && chmod 600 /root/slackbot/.env.test && echo pipe_chmod_ok'
          echo "== pipe_chmod exit=$?"
          probe plan ssh $SSH_OPTS maaren@hackclub.app 'umask 077; cat > /root/slackbot/.env.test; echo rc=$?; stat -c %a /root/slackbot/.env.test; rm -f /root/slackbot/.env.test; echo done'
          printf 'TEST=1\n' | ssh $SSH_OPTS maaren@hackclub.app 'umask 077; cat > /root/slackbot/.env.test; stat -c %a /root/slackbot/.env.test; rm -f /root/slackbot/.env.test'
          echo "== umask_pipe exit=$?"
