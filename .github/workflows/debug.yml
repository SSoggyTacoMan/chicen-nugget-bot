name: debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
    steps:
      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H hackclub.app >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: variants
        run: |
          set +e
          probe() {
            local name="$1"; shift
            "$@"
            echo "== $name exit=$?"
          }
          probe true ssh $SSH_OPTS maaren@hackclub.app 'true'
          probe echo ssh $SSH_OPTS maaren@hackclub.app 'echo hi'
          probe setx ssh $SSH_OPTS maaren@hackclub.app 'set -x; echo hi'
          probe touch ssh $SSH_OPTS maaren@hackclub.app 'touch /root/slackbot/.env.test && echo ok'
          probe rm ssh $SSH_OPTS maaren@hackclub.app 'rm -f /root/slackbot/.env.test'
          probe id ssh $SSH_OPTS maaren@hackclub.app 'id; echo done'
          probe systemctl ssh $SSH_OPTS maaren@hackclub.app 'systemctl is-active chicen-nugget-bot || true'
          probe long ssh $SSH_OPTS maaren@hackclub.app 'id; pwd; ls -ld ~ ~/slackbot; df -h ~; echo done'
          printf 'TEST=1\n' | ssh $SSH_OPTS maaren@hackclub.app 'cat > /root/slackbot/.env.test && wc -c /root/slackbot/.env.test && rm -f /root/slackbot/.env.test'
          echo "== pipe exit=$?"

      - name: verbose
        run: |
          set +e
          ssh -vvv $SSH_OPTS maaren@hackclub.app 'true' 2> /tmp/ssh.log
          echo "== verbose exit=$?"
          tail -25 /tmp/ssh.log
