name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: install
        run: |
          pip install --only-binary :all: --require-hashes -r requirements.lock -r requirements-dev.lock
      - name: compile
        run: python -m compileall -q bot main.py
      - name: lint
        run: ruff check bot tests --select E9,F63,F7,F82
      - name: tests
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # Put the failing tests in the check-run annotations. Workflow logs
            # need repo admin rights, annotations are readable from the API.
            summary=$(grep -E "^(FAILED|ERROR)|^=+ (FAILURES|ERRORS)" -A 20 pytest.log | tail -120 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r//g' | cut -c1-6000)
            echo "::error title=pytest failed::$summary"
          fi
          exit "$code"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'slackbot' }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'chicen-nugget-bot' }}
      SERVICE_USER: ${{ secrets.SERVICE_USER || 'chicen' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: test ssh
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            # `if` keeps `bash -e` (GitHub's default) from killing the loop
            # when ssh exits 255 even though the remote command succeeded.
            if out=$(ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo SSH_OK' 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q SSH_OK; then
              echo "ssh ok (ssh exit $code)"
              exit 0
            fi
            echo "ssh attempt $i failed (ssh exit $code); retrying in 5s"
            sleep 5
          done
          exit 1

      - name: sync files
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            if rsync -az --partial \
              -e "ssh $SSH_OPTS -p $SSH_PORT" \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '.env' \
              --exclude '.venv/' \
              --exclude '__pycache__/' \
              --exclude '.pytest_cache/' \
              --exclude '.ruff_cache/' \
              --exclude 'data/' \
              --exclude 'logs/' \
              --exclude '*.db' \
              --exclude '*.db-wal' \
              --exclude '*.db-shm' \
              ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"; then
              echo "sync ok"
              exit 0
            fi
            echo "rsync attempt $i failed; retrying in 5s"
            sleep 5
          done
          exit 1

      - name: write env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -uo pipefail
          # SERVICE_USER is optional: only chown when the account exists on the
          # host. A missing account used to fail the whole deploy (invalid
          # user), even though the service runs fine as the ssh user.
          CHOWN="if id -u $SERVICE_USER >/dev/null 2>&1; then chown $SERVICE_USER:$SERVICE_USER .env; else echo 'note: no $SERVICE_USER account, leaving .env owned by the ssh user'; fi"
          for i in 1 2 3 4; do
            if out=$(printf '%s\n' "$ENV_FILE" | ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cd \$HOME/$DEPLOY_PATH && cat > .env && { $CHOWN; } && chmod 600 .env && echo ENV_OK" 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q ENV_OK; then
              echo "env ok (ssh exit $code)"
              exit 0
            fi
            echo "env attempt $i failed (ssh exit $code); retrying in 10s"
            sleep 10
          done
          exit 1

      - name: install and restart
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            if out=$(ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e
              cd $DEPLOY_PATH
              mkdir -p logs data
              if command -v python3.13 >/dev/null; then PY=python3.13; else PY=python3; fi
              \$PY -m venv .venv
              .venv/bin/pip install -q --only-binary :all: --require-hashes -r requirements.lock
              PLAYWRIGHT_BROWSERS_PATH=0 .venv/bin/playwright install chromium >/dev/null 2>&1 || true
              mkdir -p logs data
              if id -u $SERVICE_USER >/dev/null 2>&1; then
                chown -R $SERVICE_USER:$SERVICE_USER .
              else
                echo note: no $SERVICE_USER account, keeping current file ownership
              fi
              if [ -f data/bot.db ]; then
                .venv/bin/python -c 'import sqlite3,time; s=sqlite3.connect(\"data/bot.db\"); d=sqlite3.connect(\"data/bot.db.bak.\"+str(int(time.time()))); s.backup(d); d.close(); s.close()'
                ls -1t data/bot.db.bak.* 2>/dev/null | tail -n +4 | xargs -r rm -f
              fi
              systemctl restart $SERVICE_NAME
              sleep 3
              systemctl --no-pager --full status $SERVICE_NAME | head -15
              echo '--- log ---'
              tail -20 logs/bot.log || true
              echo DEPLOY_OK" 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q DEPLOY_OK; then
              echo "deploy ok (ssh exit $code)"
              exit 0
            fi
            echo "deploy attempt $i failed (ssh exit $code); retrying in 10s"
            sleep 10
          done
          exit 1
