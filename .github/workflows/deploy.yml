name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SSH_OPTS: -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || 'slackbot' }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'chicen-nugget-bot' }}
    steps:
      - uses: actions/checkout@v4

      - name: configure ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: test ssh
        run: |
          set -uo pipefail
          for i in 1 2 3 4 5; do
            # `if` keeps `bash -e` (GitHub's default) from killing the loop
            # when ssh exits 255 even though the remote command succeeded.
            if out=$(ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'echo SSH_OK' 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q SSH_OK; then
              echo "ssh ok (ssh exit $code)"
              exit 0
            fi
            echo "ssh attempt $i failed (ssh exit $code); retrying in 5s"
            sleep 5
          done
          exit 1

      - name: sync files
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            if rsync -az --partial \
              -e "ssh $SSH_OPTS -p $SSH_PORT" \
              --exclude '.git/' \
              --exclude '.github/' \
              --exclude '.env' \
              --exclude '.venv/' \
              --exclude '__pycache__/' \
              --exclude '.pytest_cache/' \
              --exclude '.ruff_cache/' \
              --exclude 'data/' \
              --exclude 'logs/' \
              --exclude '*.db' \
              --exclude '*.db-wal' \
              --exclude '*.db-shm' \
              ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"; then
              echo "sync ok"
              exit 0
            fi
            echo "rsync attempt $i failed; retrying in 5s"
            sleep 5
          done
          exit 1

      - name: write env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            if out=$(printf '%s\n' "$ENV_FILE" | ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "cat > \$HOME/$DEPLOY_PATH/.env && chmod 600 \$HOME/$DEPLOY_PATH/.env && echo ENV_OK" 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q ENV_OK; then
              echo "env ok (ssh exit $code)"
              exit 0
            fi
            echo "env attempt $i failed (ssh exit $code); retrying in 10s"
            sleep 10
          done
          exit 1

      - name: install and restart
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            if out=$(ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "set -e
              cd $DEPLOY_PATH
              mkdir -p logs data
              if command -v python3.13 >/dev/null; then PY=python3.13; else PY=python3; fi
              \$PY -m venv .venv
              .venv/bin/pip install -q --upgrade pip
              .venv/bin/pip install -q -r requirements.txt
              .venv/bin/playwright install chromium >/dev/null 2>&1 || true
              systemctl restart $SERVICE_NAME
              sleep 3
              systemctl --no-pager --full status $SERVICE_NAME | head -15
              echo '--- log ---'
              tail -20 logs/bot.log || true
              echo DEPLOY_OK" 2>&1); then
              code=0
            else
              code=$?
            fi
            printf '%s\n' "$out"
            if [ "$code" -eq 0 ] || printf '%s' "$out" | grep -q DEPLOY_OK; then
              echo "deploy ok (ssh exit $code)"
              exit 0
            fi
            echo "deploy attempt $i failed (ssh exit $code); retrying in 10s"
            sleep 10
          done
          exit 1
