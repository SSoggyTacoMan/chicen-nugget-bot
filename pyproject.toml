[project]
name = "chicen-nugget-bot"
version = "0.1.0"
description = "A friendly personal Slack bot: welcomer, tier-2 access requests, AI agent, polls and reminders."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
